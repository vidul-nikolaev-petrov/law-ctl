<!DOCTYPE HTML>
<html lang="bg" class="coal" dir="ltr">
    <head>
        <!-- sidebar iframe generated using mdBook

        This is a frame, and not included directly in the page, to control the total size of the
        book. The TOC contains an entry for each page, so if each page includes a copy of the TOC,
        the total size of the page becomes O(n**2).

        The frame is only used as a fallback when JS is turned off. When it's on, the sidebar is
        instead added to the main page by `toc.js` instead. The JavaScript mode is better
        because, when running in a `file:///` URL, the iframed page would not be Same-Origin as
        the rest of the page, so the sidebar and the main page theme would fall out of sync.
        -->
        <meta charset="UTF-8">
        <meta name="robots" content="noindex">
        <!-- Custom HTML head -->
        <script>
        document.addEventListener("DOMContentLoaded", () => {
          const search = document.getElementById("searchbar");
          
          if (search) {
            search.placeholder = "Търси в книгата...";
          }
        });
        </script>
        
        <script>
        document.addEventListener("DOMContentLoaded", function () {
            function translateSearchResults() {
                document.querySelectorAll("#searchresults-header, #searchresults-header *").forEach(function (el) {
                    const strEn = "No search results for";
                    const strBg = "Няма намерени резултати за";
                    
                    if (el.children.length === 0 &&
                        el.textContent.includes(strEn)) {
                        el.textContent = el.textContent.replace(strEn, strBg);
                    }
                });
            }
        
            const observer = new MutationObserver(translateSearchResults);
        
            observer.observe(document.body, {
                childList: true,
                subtree: true
            });
        });
        </script>
        
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="theme-color" content="#ffffff">
        <link rel="stylesheet" href="css/variables.css">
        <link rel="stylesheet" href="css/general.css">
        <link rel="stylesheet" href="css/chrome.css">
        <link rel="stylesheet" href="css/print.css" media="print">
        <!-- Fonts -->
        <link rel="stylesheet" href="FontAwesome/css/font-awesome.css">
        <link rel="stylesheet" href="fonts/fonts.css">
        <!-- Custom theme stylesheets -->
        <link rel="stylesheet" href="src/custom.css">
        <link rel="stylesheet" href="theme/custom.css">
    </head>

    </body>
</html>
